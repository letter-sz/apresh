[workspace]
members = [
    "src/contract",
    "src/crates/derive",
    "src/crates/crypto",
    "src/crates/qr-code",
    "src/crates/wasm",
    "src/crates/engine",
    "src/crates/types",
    "src/crates/store", "src/crates/entrypoint",
]
resolver = "2"

[workspace.dependencies]
apresh-derive = { path = "src/crates/derive" }
apresh-engine = { path = "src/crates/engine" }
apresh-qr-code = { path = "src/crates/qr-code" }
apresh-crypto = { path = "src/crates/crypto" }
apresh-types = { path = "src/crates/types" }
apresh-store = { path = "src/crates/store" }
wasm-bindgen = { version = "0.2.84" }
web-sys = { version = "0.3.63", features = ["Crypto", "Window"] }
aes-gcm = { version = "0.10.3", default-features = false, features = [
    "aes",
    "alloc",
] }
candid = "0.10.12"
derive_deref = "1.1.1"
ic-cdk = "0.17.1"
ic-cdk-timers = "0.11.0"
ic-stable-structures = "0.6.8"
serde = { version = "1.0.217", features = ["derive"] }
icrc-ledger-types = "0.1.6"
anyhow = "1.0.95"
image = { version = "0.24", features = ["png"], default-features = false }
thiserror = "2.0.11"
qrcode-generator = "4.1"
x25519-dalek = { version = "2.0.1", default-features = false, features = [
    "alloc",
    "precomputed-tables",
    "static_secrets",
    "serde",
] }
colorgrad = "0.6"
sha2 = "0.10.8"
hex-literal = "0.4.1"
hex = "0.4.3"
bincode = { version = "1.3.3" }
bcs = "0.1.6"
