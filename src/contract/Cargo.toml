[package]
name = "contract"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["mainnet"]
mainnet = ["admin", "whitelist", "no-mocks"]
no-mocks = []
admin = []
whitelist = []

[dependencies]
candid = { workspace = true }
ic-cdk = { workspace = true }
derive_deref = { workspace = true }
serde = { workspace = true }
icrc-ledger-types = { workspace = true }
anyhow = { workspace = true }
image = { workspace = true }
qrcode-generator = { workspace = true }
colorgrad = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ic-stable-structures = { workspace = true }
apresh-store = { workspace = true }
apresh-types = { workspace = true, features = ["icp"] }
apresh-derive = { workspace = true }
apresh-engine = { workspace = true, features = ["icp"] }
apresh-qr-code = { workspace = true }
apresh-crypto = { workspace = true }
entrypoint = { workspace = true }
balances = { workspace = true }

[dev-dependencies]
pocket-ic = "6.0.0"
rstest = "0.24.0"
